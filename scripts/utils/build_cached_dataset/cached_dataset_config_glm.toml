# GLM-5.3-Flash mid-train · role loss_scale 构建配置

model = "/data_train/train/glm/models/GLM-5.3-Flash"
ip_file = "/data_train/train/qwen/main-queue.txt"

[runtime]
env_bin = "/data_train/train/glm/envs/mid-prod/bin"
ms_swift_repo = "/data_train/vectorchen/github/ms-swift"
cuda_fallback_ld_path = "/data_train/train/glm/envs/mid-prod/lib/python3.12/site-packages/nvidia/cudnn/lib:/usr/local/cuda/lib64"

[dataset]
base = "/data_train/vectorchen/echo_experiments/glm5_3_flash_midtrain_20261001/datasets"
files = ["train_no_loss_scale.jsonl"]

[output]
allowed_output_root = "/data_train/vectorchen/echo_experiments/glm5_3_flash_midtrain_20261001"
work_root = "/data_train/vectorchen/echo_experiments/glm5_3_flash_midtrain_20261001/cached_dataset/work"
raw_shards_dir = "/data_train/vectorchen/echo_experiments/glm5_3_flash_midtrain_20261001/cached_dataset/work/raw_shards_64"
cached_shards_dir = "/data_train/vectorchen/echo_experiments/glm5_3_flash_midtrain_20261001/cached_dataset/work/cached_shards_64"
final_out_dir = "/data_train/vectorchen/echo_experiments/glm5_3_flash_midtrain_20261001/cached_dataset/glm53_midtrain"
log_dir = "/data_train/vectorchen/echo_experiments/glm5_3_flash_midtrain_20261001/cached_dataset/work/logs"
local_work_root = "/tmp/vcd-glm53"

[build]
total_shards = 64
copy_parallel = 4
save_num_proc = 64
auto_merge = true
stale_task_seconds = 1800
heartbeat_seconds = 30
progress_interval_seconds = 30
max_worker_rounds = 3
split_buffer_bytes = 4194304
split_num_proc = 32
split_chunk_bytes = 8589934592
split_worker_buffer_bytes = 67108864
merge_group_size = 64

[export]
template = "glm5_next"
agent_template = "glm5_1"
loss_scale = "role"
role_loss_config = "./role_loss_config.json"
materialize_role_weights = true
max_length = 131072
truncation_strategy = "right"
dataset_num_proc = 64
dataset_shuffle = true
data_seed = 20260909
split_dataset_ratio = 0.0
load_from_cache_file = true
to_cached_dataset = true
